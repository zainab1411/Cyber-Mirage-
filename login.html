<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تسجيل الدخول - لوحة الإدارة</title>
<style>
  body {
    background-color: #f4f6f8;
    color: #1f2937;
    font-family: 'Segoe UI', Tahoma, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .box {
    background: white;
    border: 1px solid #d9dfe4;
    border-radius: 8px;
    padding: 30px;
    width: 300px;
  }
  h2 {
    font-size: 17px;
    margin-bottom: 20px;
  }
  input {
    width: 100%;
    padding: 8px;
    margin-bottom: 12px;
    border: 1px solid #d9dfe4;
    border-radius: 5px;
  }
  button {
    width: 100%;
    background-color: #1f6fb2;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="box">
    <h2>لوحة إدارة النظام</h2>
    <input type="text" placeholder="اسم المستخدم">
    <input type="password" placeholder="كلمة المرور">
    <button>تسجيل الدخول</button>
  </div>
</body>
</html>
