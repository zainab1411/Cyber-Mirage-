<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Mirage Portal</title>
<style>
*{box-sizing:border-box}
:root{--bg:#e3e6ec;--sd:#b8bcc8;--sl:#ffffff;--ac:#1a73e8;--tx:#2b3445}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:var(--tx);overflow:hidden}
.orb{position:fixed;border-radius:50%;filter:blur(60px);opacity:.5;animation:float 8s ease-in-out infinite}
.orb.a{width:260px;height:260px;background:#9cc4ff;top:-60px;left:-60px}
.orb.b{width:300px;height:300px;background:#c7d8ff;bottom:-80px;right:-80px;animation-delay:-4s}
@keyframes float{50%{transform:translate(30px,40px)}}
.card{position:relative;width:90%;max-width:380px;padding:34px 28px;border-radius:34px;background:var(--bg);box-shadow:12px 12px 28px var(--sd),-12px -12px 28px var(--sl);text-align:center;overflow:hidden;animation:rise .7s ease both}
@keyframes rise{from{opacity:0;transform:translateY(24px)}}
.logo{width:56px;height:56px;margin:0 auto 10px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:6px 6px 12px var(--sd),-6px -6px 12px var(--sl)}
.logo svg{width:28px;height:28px}
h1{margin:6px 0 4px;font-size:30px;letter-spacing:.5px}
.sub{margin:0 0 22px;font-size:14px;color:#6b7588}
.field{position:relative;margin-bottom:16px}
.field svg{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:18px;height:18px;fill:#7b8599}
.field input{width:100%;padding:14px 16px 14px 46px;border:0;border-radius:16px;background:var(--bg);font-size:15px;color:var(--tx);outline:0;box-shadow:inset 5px 5px 10px var(--sd),inset -5px -5px 10px var(--sl);transition:.25s}
.field input:focus{box-shadow:inset 5px 5px 10px var(--sd),inset -5px -5px 10px var(--sl),0 0 0 2px rgba(26,115,232,.45)}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#6b7588;margin:4px 2px 18px}
.row label{display:flex;align-items:center;gap:8px;cursor:pointer}
.tg{width:38px;height:20px;border-radius:20px;background:var(--bg);box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl);position:relative;transition:.3s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#9aa4b8;transition:.3s}
#rem{display:none}
#rem:checked+.tg::after{left:21px;background:var(--ac)}
.btn{width:100%;padding:14px;border:0;border-radius:16px;background:var(--bg);color:var(--tx);font-weight:700;letter-spacing:1px;font-size:15px;cursor:pointer;box-shadow:6px 6px 14px var(--sd),-6px -6px 14px var(--sl);transition:.2s}
.btn:hover{color:var(--ac)}
.btn:active{box-shadow:inset 4px 4px 9px var(--sd),inset -4px -4px 9px var(--sl)}
.error{background:#fdecea;color:#b3261e;padding:10px;border-radius:14px;margin-bottom:16px;font-size:14px;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.blade{position:absolute;top:0;bottom:0;left:-60%;width:50%;background:linear-gradient(90deg,transparent,rgba(26,115,232,.55),transparent);transform:skewX(-20deg);pointer-events:none}
.card.sweep .blade{animation:sweep .65s ease-in forwards}
@keyframes sweep{to{left:130%}}
.note{margin:18px 0 0;font-size:12px;color:#8a94a8;direction:rtl}
</style>
</head>
<body>
    <div class="orb a"></div>
<div class="orb b"></div>

<div class="card" id="card">
  <span class="blade"></span>
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="#1a73e8"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3z"/></svg>
  </div>
  <h1>Login</h1>
  <p class="sub">Sign in to your account</p>

  {% if error %}
  <div class="error">Invalid username or password</div>
  {% endif %}

  <form method="POST" action="/portal" id="f">
    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/></svg>
      <input type="text" name="username" placeholder="Username" autocomplete="off" required>
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v13h14V9h-2zm-8 0V7a3 3 0 0 1 6 0v2H9z"/></svg>
      <input type="password" name="password" placeholder="Password" autocomplete="off" required>
    </div>
    <div class="row">
      <label><input type="checkbox" id="rem"><span class="tg"></span>Remember me</label>
      <span>Forgot password?</span>
    </div>
    <button class="btn" type="submit">SIGN IN</button>
  </form>

  <p class="note">هذه صفحة تجريبية لمشروع Cyber Mirage، اكتب بيانات عشوائية ولا تكتب بياناتك الحقيقية.</p>
</div>

<script>
var f = document.getElementById("f"), c = document.getElementById("card");
f.addEventListener("submit", function (e) {
  e.preventDefault();
  c.classList.add("sweep");
  setTimeout(function () { f.submit(); }, 650);
});
</script>
</body>
</html>
