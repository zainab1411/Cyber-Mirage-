<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Cyber-Mirage</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* تنسيقات الوضع النهاري السريعة لضمان عمل الثيم بشكل ممتاز */
    body.light-mode {
      background-color: #f4f7f6 !important;
      color: #333 !important;
    }
    body.light-mode .card {
      background-color: #ffffff !important;
      color: #333 !important;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    body.light-mode input, body.light-mode table {
      background-color: #ffffff !important;
      color: #333 !important;
      border-color: #ccc !important;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-title" style="display: flex; align-items: center; gap: 12px;">
      <!-- صورة اللوجو وبجانبها اسم المشروع -->
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Cyber-Mirage Logo" style="height: 40px; width: auto; object-fit: contain; border-radius: 6px;">
      <span style="font-size: 20px; font-weight: bold; color: #00f2fe;">Cyber-Mirage</span>
    </div>
    
    <!-- زر تبديل الوضع الليلي والنهاري + وقت التحديث -->
    <div style="display: flex; align-items: center; gap: 10px;">
      <button id="themeToggle" style="padding: 5px 12px; border-radius: 6px; background: #333; color: #fff; border: 1px solid #555; cursor: pointer; font-size: 13px;">☀️ وضع نهاري</button>
      <span class="updated" id="updated">آخر تحديث: قبل لحظات</span>
    </div>
  </div>

  <div class="cards">
    <div class="card">
      <p class="card-label">إجمالي المحاولات</p>
      <p class="card-value" id="total">--</p>
    </div>
    <div class="card">
      <p class="card-label">تكرارًا IP أكثر</p>
      <p class="card-value" id="topip">--</p>
    </div>
  </div>

  <div class="alert" id="alert" style="display:none;">
    ⚠️ نشاط مرتفع من IP واحد خلال آخر 10 دقائق
  </div>

  <div class="card" style="max-width:400px; margin:20px auto;">
    <p class="card-label">نسبة الهجمات حسب الدولة</p>
    <canvas id="countryChart"></canvas>
  </div>

  <!-- بطاقة ملخص أعلى 3 دول هجوماً -->
  <div class="card" style="max-width:400px; margin:20px auto;">
    <p class="card-label">أعلى 3 دول هجوماً</p>
    <ul id="topCountriesList" style="list-style: none; padding: 0; text-align: right; margin-top: 10px;">
      <!-- سيتم تعبئتها تلقائياً من الـ JavaScript -->
    </ul>
  </div>

  <div class="card" style="max-width:600px; margin:20px auto; display:flex; gap:10px; flex-wrap:wrap; align-items:center;">
    <input type="text" id="searchIp" placeholder="ابحث بعنوان IP..." style="flex:1; min-width:150px; padding:8px; border-radius:6px; border:1px solid #444; background:#1e1e1e; color:#fff;">
    <input type="text" id="dateFrom" placeholder="يوم/شهر/سنة (مثال: 15/09/2026)" dir="ltr" style="padding:8px; border-radius:6px; border:1px solid #444; background:#1e1e1e; color:#fff;">
    <input type="text" id="dateTo" placeholder="يوم/شهر/سنة (مثال: 15/09/2026)" dir="ltr" style="padding:8px; border-radius:6px; border:1px solid #444; background:#1e1e1e; color:#fff;">
    <button id="resetFilters" style="padding:8px 14px; border-radius:6px; border:none; background:#555; color:#fff; cursor:pointer;">إعادة تعيين</button>
  </div>

  <div style="max-width:600px; margin:0 auto 16px; text-align:left;">
    <button id="exportCsv" style="padding:8px 14px; border-radius:8px; border:1px solid rgba(0,242,254,0.3); background:linear-gradient(90deg,#00f2fe22,#b967ff22); color:#fff; cursor:pointer;">⬇️ تصدير CSV</button>
  </div>

  <table style="width:100%; max-width:600px; margin:0 auto; border-collapse:collapse;">
    <thead>
      <tr>
        <th data-sort="ip" style="cursor:pointer; padding:10px; text-align:right;">عنوان IP ⇅</th>
        <th data-sort="username" style="cursor:pointer; padding:10px; text-align:right;">اسم المستخدم ⇅</th>
        <th data-sort="time" style="cursor:pointer; padding:10px; text-align:right;">الوقت ⇅</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

  <div class="pagination" id="pagination">
    <button id="prevBtn">السابق ‹</button>
    <span id="pageInfo">صفحة 1</span>
    <button id="nextBtn">› التالي</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>

  <!-- كود تشغيل زر الوضع الليلي والنهاري -->
  <script>
    const themeToggle = document.getElementById('themeToggle');
    if (themeToggle) {
      themeToggle.addEventListener('click', () => {
        document.body.classList.toggle('light-mode');
        if (document.body.classList.contains('light-mode')) {
          themeToggle.textContent = '🌙 وضع ليلي';
          themeToggle.style.background = '#ddd';
          themeToggle.style.color = '#333';
        } else {
          themeToggle.textContent = '☀️ وضع نهاري';
          themeToggle.style.background = '#333';
          themeToggle.style.color = '#fff';
        }
      });
    }
  </script>
</body>
</html>
