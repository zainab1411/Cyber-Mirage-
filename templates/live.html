<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyber Mirage Live</title>
<link href="https://fonts.googleapis.com/css2?family=Scheherazade+New:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='dash.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='enhance.css') }}">
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="title glass">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="Cyber Mirage">
      <div>
        <h1>Cyber Mirage</h1>
        <span class="livetag"><i></i>المحاولات الحية</span>
      </div>
    </div>
    <div class="count glass"><span>عدد المحاولات</span><b id="total">0</b></div>
  </div>

  <div class="alert livealert" id="alert">⚠️ محاولة اختراق جديدة!</div>

  <div class="box glass">
    <table>
      <thead><tr><th>الوقت</th><th>اليوزر</th><th>طول الباسورد</th><th>IP</th></tr></thead>
      <tbody id="body"><tr class="empty"><td colspan="4">بانتظار المحاولات...</td></tr></tbody>
    </table>
  </div>
  <a class="back" href="/dashboard">← الداشبورد</a>
</div>

<script>
var last = 0;
async function load() {
  try {
    var r = await fetch("/api/attempts");
    if (!r.ok) return;
    var d = await r.json();
    var isNew = d.total > last && last !== 0;
    var totalEl = document.getElementById("total");
    if (d.total !== last) {
      totalEl.textContent = d.total;
      totalEl.classList.remove("bump");
      void totalEl.offsetWidth;
      totalEl.classList.add("bump");
    }
    var b = document.getElementById("body");
    b.innerHTML = "";
    if (!d.attempts.length) {
      b.innerHTML = '<tr class="empty"><td colspan="4">بانتظار المحاولات...</td></tr>';
    }
    d.attempts.forEach(function (a, i) {
      var tr = document.createElement("tr");
      if (i === 0 && isNew) tr.className = "new";
      [a.time, a.username, a.password_length, a.ip].forEach(function (v, k) {
        var td = document.createElement("td");
        td.textContent = v;
        if (k === 0 || k === 3) td.dir = "ltr";
        tr.appendChild(td);
      });
      b.appendChild(tr);
    });
    if (isNew) {
      var al = document.getElementById("alert");
      al.style.display = "block";
      setTimeout(function () { al.style.display = "none"; }, 2500);
    }
    last = d.total;
  } catch (e) {}
}
load();
setInterval(load, 2000);
</script>
<script src="{{ url_for('static', filename='enhance.js') }}"></script>
<script src="{{ url_for('static', filename='life.js') }}"></script>
</body>
</html>
